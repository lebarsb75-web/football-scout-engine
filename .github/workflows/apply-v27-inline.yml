name: Apply Football Scout V2.7

on:
  push:
    branches: [dev-v2]
    paths: [.github/workflows/apply-v27-inline.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v2
      - name: Apply tested runtime files
        run: |
          base64 --decode > /tmp/v27.patch.xz <<'V27'

V27
          xz --decompress --stdout /tmp/v27.patch.xz | git apply
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Deploy Football Scout V2.7 action report"
          git push origin dev-v2
