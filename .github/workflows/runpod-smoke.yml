name: runpod-smoke-preflight

on:
  push:
    branches: [dev-v2]
    paths:
      - '.github/workflows/runpod-smoke.yml'
      - 'scripts/runpod_smoke_test.py'
      - 'benchmarks/test-02-gameplay.json'
      - 'handler.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runpod-smoke-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install smoke-test dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Verify RunPod without submitting a paid job
        env:
          PYTHONPATH: .
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python scripts/runpod_smoke_test.py
