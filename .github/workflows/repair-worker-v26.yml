name: Repair and deploy Football Scout V2.6 backend

on:
  push:
    branches: [dev-v2]
    paths:
      - ".github/workflows/repair-worker-v26.yml"

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-v2
          fetch-depth: 0
      - name: Restore tested worker source
        run: |
          git checkout bffe5f6 -- worker/src/index.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js
          git commit -m "Restore tested Football Scout V2.6 worker"
          git push origin HEAD:dev-v2
      - name: Trigger private backend deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker.yml --ref dev-v2
