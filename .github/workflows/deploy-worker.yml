name: deploy-private-backend

on:
  push:
    branches: [dev-v2]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-private-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment credentials
        env:
          APP_ACCESS_CODE: ${{ secrets.APP_ACCESS_CODE }}
          UPLOAD_SIGNING_SECRET: ${{ secrets.UPLOAD_SIGNING_SECRET }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          missing=0
          for key in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            APP_ACCESS_CODE \
            UPLOAD_SIGNING_SECRET \
            RUNPOD_API_KEY
          do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is not configured in GitHub Actions secrets"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Ensure R2 upload bucket exists
        run: |
          if npx wrangler r2 bucket list | grep -Fq 'football-scout-videos'; then
            echo 'R2 bucket football-scout-videos already exists.'
          else
            npx wrangler r2 bucket create football-scout-videos --location weur
          fi

      - name: Ensure D1 database exists
        run: |
          database_id="$(
            npx wrangler d1 list --json | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const databases = JSON.parse(input);
                const database = databases.find(item => item.name === "football-scout-db");
                process.stdout.write(database?.uuid || database?.id || "");
              });
            '
          )"

          if [ -z "$database_id" ]; then
            npx wrangler d1 create football-scout-db --location weur
            database_id="$(
              npx wrangler d1 list --json | node -e '
                let input = "";
                process.stdin.on("data", chunk => input += chunk);
                process.stdin.on("end", () => {
                  const databases = JSON.parse(input);
                  const database = databases.find(item => item.name === "football-scout-db");
                  process.stdout.write(database?.uuid || database?.id || "");
                });
              '
            )"
          fi

          if [ -z "$database_id" ]; then
            echo '::error::Unable to resolve the D1 database ID.'
            exit 1
          fi

          echo "D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"

      - name: Bind D1 database
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "wrangler.jsonc";
            const source = fs.readFileSync(path, "utf8");
            const placeholder = "REPLACE_AFTER_D1_CREATION";
            if (!source.includes(placeholder)) {
              throw new Error(`Missing ${placeholder} in ${path}`);
            }
            fs.writeFileSync(path, source.replace(placeholder, process.env.D1_DATABASE_ID));
          '

      - name: Apply D1 schema
        run: npx wrangler d1 execute football-scout-db --remote --file schema.sql

      - name: Deploy Worker with private secrets
        env:
          APP_ACCESS_CODE: ${{ secrets.APP_ACCESS_CODE }}
          UPLOAD_SIGNING_SECRET: ${{ secrets.UPLOAD_SIGNING_SECRET }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          secrets_file="$RUNNER_TEMP/football-scout-worker-secrets.json"
          deploy_log="$RUNNER_TEMP/football-scout-worker-deploy.log"
          trap 'rm -f "$secrets_file"' EXIT

          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              APP_ACCESS_CODE: process.env.APP_ACCESS_CODE,
              UPLOAD_SIGNING_SECRET: process.env.UPLOAD_SIGNING_SECRET,
              RUNPOD_API_KEY: process.env.RUNPOD_API_KEY
            }));
          ' "$secrets_file"

          npx wrangler deploy --secrets-file "$secrets_file" | tee "$deploy_log"

          worker_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$deploy_log" | tail -1 || true)"
          if [ -n "$worker_url" ]; then
            echo '### Worker deployed' >> "$GITHUB_STEP_SUMMARY"
            echo "$worker_url" >> "$GITHUB_STEP_SUMMARY"
          fi
