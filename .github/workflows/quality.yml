name: quality

on:
  push:
    branches: [main, dev-v2]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Python syntax
        run: |
          python -m py_compile handler.py
          python -m py_compile api/app.py
          python -m py_compile api/costs.py
          python -m py_compile api/security.py
          python -m py_compile api/idempotency.py
          python -m py_compile api/results.py
          python -m py_compile api/jobs.py
          python -m py_compile scripts/build_clips.py
          python -m py_compile scripts/render_report.py
          python -m py_compile scripts/cost_from_result.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Validate JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('contracts').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY
      - name: Check RunPod entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path('handler.py').read_text(encoding='utf-8')
          dockerfile = Path('Dockerfile').read_text(encoding='utf-8')
          assert 'runpod.serverless.start' in code
          assert 'handler.py' in dockerfile
          print('RunPod contract OK')
          PY
      - name: Enforce paid GPU locks
        run: |
          python - <<'PY'
          from pathlib import Path
          env = Path('api/.env.example').read_text(encoding='utf-8')
          app = Path('api/app.py').read_text(encoding='utf-8')
          assert 'ENABLE_PAID_GPU=false' in env
          assert 'COST_APPROVAL_SECRET=' in env
          assert 'VIDEO_HOST_ALLOWLIST=' in env
          assert 'approval_secret_matches' in app
          assert 'validate_video_url_for_submission' in app
          assert 'X-Idempotency-Key' in app
          assert 'ENABLE_PAID_GPU = os.getenv("ENABLE_PAID_GPU", "false")' in app
          print('Independent cost, URL and duplicate-submission gates OK')
          PY
      - name: Check local job registry
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('api/app.py').read_text(encoding='utf-8')
          jobs = Path('api/jobs.py').read_text(encoding='utf-8')
          assert 'JobStore' in app
          assert '/analysis/jobs' in app
          assert 'provider_job_id' in jobs
          assert 'data.pop("provider_job_id", None)' in jobs
          print('Persistent local job registry contract OK')
          PY
      - name: Check web prototype files
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js
          test -f web/result-demo.html
